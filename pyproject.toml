[project]
name = "forest-cover-app"
version = "0.1.0"
description = "Streamlit app for the Forest Cover Type classification project (HEC Paris Tooling for the Data Scientist final project)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nick Hartmann" }]
dependencies = [
    "streamlit>=1.38,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.6,<2",
    "xgboost-cpu>=3.0,<4 ; sys_platform == 'linux'",
    "xgboost>=3.0,<4 ; sys_platform != 'linux'",
    "plotly>=5.24,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.7,<1",
    "pre-commit>=3.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forestcover"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D212", "D213", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "B"]
"app/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["forestcover"]
